# Checks every pull request: device support on the host, the firmware build, and the app.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-tests:
    name: Device tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          cmake -S firmware/test/host -B build/host
          cmake --build build/host -j
          ctest --test-dir build/host --output-on-failure

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.3
          target: esp32s3
          path: firmware
          command: idf.py build

  website:
    name: Website checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'website/test/*.test.mjs'
      - name: The firmware variants file is valid
        run: jq -e 'all(.[]; .id and .name and .chip and .file and .requires.flash_mb)' firmware/builds.json

  app:
    name: App checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx prettier --check src

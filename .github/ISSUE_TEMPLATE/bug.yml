name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Gateway firmware (app Settings) and app version, and the phone's OS
  - type: textarea
    id: devices
    attributes:
      label: Devices involved
      description: The device and its model, if the problem is with one
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
